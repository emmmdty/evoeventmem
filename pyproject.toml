[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evoeventmem"
version = "0.1.0"
description = "Evidence-aware temporal event memory for long-horizon agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "EvoEventMem contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3",
  "mcp>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
models = ["openai>=1.70,<3"]
postgres = [
  "asyncpg>=0.30,<1",
  "pgvector>=0.3,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
]
bench = [
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "tqdm>=4.67,<5",
]
mcp = [
    "mcp>=1.2,<2",
]

[project.scripts]
evoeventmem = "evoeventmem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evoeventmem"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Field 'lifespan' has an incomplete definition:pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["evoeventmem"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "pgvector", "pgvector.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["evoeventmem"]
branch = true

[dependency-groups]
dev = [
    "pytest-xdist>=3,<4",
]
