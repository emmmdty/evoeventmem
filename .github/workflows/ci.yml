name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev --extra models --extra postgres --extra bench
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest tests/consolidation tests/retrieval tests/domain tests/extraction tests/infra tests/linking benchmarks -q
      - run: uv run python -m evoeventmem.cli smoke

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t evoeventmem:ci .
