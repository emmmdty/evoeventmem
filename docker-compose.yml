services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: evoeventmem
      POSTGRES_PASSWORD: evoeventmem
      POSTGRES_DB: evoeventmem
    ports:
      - "${EEM_PG_PORT:-5432}:5432"
    volumes:
      - evoeventmem_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoeventmem"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://evoeventmem:evoeventmem@postgres:5432/evoeventmem
      EEM_STORE: postgres
      EEM_DB_CONNECT_TIMEOUT: "10"
      EEM_DB_OPERATION_TIMEOUT: "30"
      EEM_LOG_LEVEL: INFO
      EEM_EMBEDDING_PROVIDER: deterministic
      EEM_EMBEDDING_MODEL_ID: test-model
      EEM_EMBEDDING_DIMENSION: "4"
      EEM_SCHEMA_VERSION: memory.v1
      EEM_ALLOW_DEV_FALLBACK: "0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readiness', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  smoke:
    image: python:3.12-slim
    command: ["python", "/scripts/compose_smoke.py", "--base-url", "http://api:8000"]
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - smoke
    restart: "no"

volumes:
  evoeventmem_pg:
