# Workstream C analysis configuration (C3+), r2 pilot edition.
# Narrowed to the methods actually present in the finalized r2 run
# (longmemeval-test20-r2: vector_rag, etec, full). The full main.toml
# declares lme_etec_vs_raw_events which requires event_no_etec; that method
# is absent from r2, so main.toml cannot be validated against it. The
# comparison set here is the honest subset available from the run's methods.
# This file contains NO result values; every number here is a parameter.
#
# The analysis_id is derived from the config hash (canonical form of this
# file) plus the FINALIZED hashes of every source run. Changing any
# declaration here changes the analysis_id.

[analysis]
schema_version = "analysis.config.v1"
datasets = ["longmemeval"]
metrics = ["exact_match", "token_f1", "evidence_f1"]
holm_family = "primary"

[analysis.bootstrap]
n_boot = 10000
seed = 0
alpha = 0.05

[analysis.review]
# Deterministic stratified failure sample: at least this many failures, or
# all failures when fewer exist.
target_min_failures = 50
stratified = true

[analysis.comparisons.longmemeval]
primary = [
  { id = "lme_qemr_vs_fixed_vector", left = "full", right = "vector_rag", metric = "exact_match" },
]
