schema_version = "locomo.config.v1"
run_id_prefix = "m14-locomo-main"
dataset_path = "data/raw/locomo/locomo10.json"
methods = ["no_memory", "full_context", "session_summary", "vector_rag", "event_no_etec", "etec", "full"]
provider = "openai_compatible"
max_input_tokens = 4096
max_candidates_per_source = 128
max_items_per_source = 8
structural_match_f1_threshold = 0.5

# NOTE: the embedding endpoint was resolved by the user on 2026-08-06:
# gpu-5090 is authoritative (qwen3-embedding-0.6b on 127.0.0.1:11436 via
# `ssh -L 11436:127.0.0.1:11436 gpu-5090`).
[reader]
provider = "openai_compatible"
model_id = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "OPENAI_API_KEY"
timeout_s = 60
thinking = "disabled"

[extractor]
provider = "openai_compatible"
model_id = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "OPENAI_API_KEY"
timeout_s = 60
thinking = "disabled"

[embedding]
provider = "openai_compatible"
model_id = "qwen3-embedding-0.6b"
base_url = "http://127.0.0.1:11436/v1"
api_key_env = "EMBEDDING_API_KEY"
timeout_s = 60
