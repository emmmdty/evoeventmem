schema_version = "locomo.config.v1"
run_id_prefix = "m14-locomo-main"
dataset_path = "data/raw/locomo/locomo10.json"
methods = ["no_memory", "full_context", "session_summary", "vector_rag", "event_no_etec", "etec", "full"]
provider = "openai_compatible"
embedding_provider = "openai_compatible"
chat_model_id = "deepseek-v4-flash"
embedding_model_id = "qwen3-embedding-0.6b"
max_input_tokens = 4096
max_candidates_per_source = 128
max_items_per_source = 8

[live_provider]
base_url = "https://api.deepseek.com"
api_key_env = "OPENAI_API_KEY"
chat_model = "deepseek-v4-flash"
disable_thinking = true
# qwen3-embedding-0.6b served on gpu-5090 (ssh -L 11436:127.0.0.1:11436 gpu-5090); bge-m3 on 11435
embedding_base_url = "http://127.0.0.1:11436/v1"
embedding_api_key_env = "EMBEDDING_API_KEY"
embedding_model = "qwen3-embedding-0.6b"
timeout_s = 60
