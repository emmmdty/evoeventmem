apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evoeventmem-ingress
  namespace: evoeventmem
  labels:
    app.kubernetes.io/name: evoeventmem
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - evoeventmem.example.com
      secretName: evoeventmem-tls
  rules:
    - host: evoeventmem.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 8000
